# Mais além (ilhas): compreensão de listas com filtro.
id: quadrados-pares
titulo: {pt: "Quadrados dos pares, numa linha", en: "Squares of the evens, in one line"}
tipo: funcao
bloco: "mais_alem"
regiao: ilhas
dificuldade: 2
origem: mais_alem
estado: rascunho
enunciado:
  pt: |
    Escreve a função quadrados_pares(numeros) que recebe uma lista de inteiros e devolve uma nova lista com o quadrado de cada número par,
    pela mesma ordem. Usa uma compreensão de listas: [... for x in numeros if ...]. Se não houver pares, devolve [].
  en: |
    Write the function quadrados_pares(numeros) that receives a list of integers and returns a new list with the square of each even number,
    in the same order. Use a list comprehension: [... for x in numeros if ...]. If there are no evens, return [].
assinatura: "quadrados_pares(numeros)"
exemplos:
  - args: [[2, 3, 4]]
    devolve: [4, 16]
testes:
  - {args: [[1, 2, 3, 4]], devolve: [4, 16]}
  - {args: [[]], devolve: []}
  - {args: [[1, 3, 5]], devolve: []}
  - {args: [[0, -2]], devolve: [0, 4]}
  - {args: [[10]], devolve: [100]}
comparacao: exato
ordem_importa: true
pistas:
  - {pt: "Um número é par se numero % 2 == 0.", en: "A number is even if number % 2 == 0."}
limite_tempo_s: 2
solucao_referencia: |
  def quadrados_pares(numeros):
      return [x * x for x in numeros if x % 2 == 0]

# Ciclo for com acumuladores de máximo e mínimo (bloco 5, rio), sem max() nem min().
id: maior-menor
titulo: {pt: "O maior e o menor da turma", en: "The tallest and the shortest of the class"}
tipo: programa
bloco: "5"
regiao: rio
dificuldade: 3
origem: novo
estado: rascunho
enunciado:
  pt: |
    Num jogo de cartas, cada jogador tira um número. Lê quantos números vais introduzir (pelo menos 1) e depois esses números, um por linha.
    Escreve o maior e o menor valor, numa linha, no formato: Maior: X Menor: Y

    🧱 Requisito: tens de usar um ciclo for. Não uses max() nem min(): vai guardando o maior e o menor à medida que lês.
  en: |
    In a card game, each player draws a number. Read how many numbers you will enter (at least 1) and then those numbers, one per line.
    Print the largest and the smallest value, on one line, in the format: Largest: X Smallest: Y

    🧱 Requirement: you must use a for loop. Do not use max() or min(): keep the largest and the smallest as you read.
exemplos:
  - stdin: "5\n4\n3\n9\n-3\n0\n"
    stdout: {pt: "Maior: 9 Menor: -3", en: "Largest: 9 Smallest: -3"}
testes:
  - stdin: "1\n5\n"
    stdout: {pt: "Maior: 5 Menor: 5", en: "Largest: 5 Smallest: 5"}
  - stdin: "3\n-1\n-7\n-2\n"
    stdout: {pt: "Maior: -1 Menor: -7", en: "Largest: -1 Smallest: -7"}
  - stdin: "2\n0\n0\n"
    stdout: {pt: "Maior: 0 Menor: 0", en: "Largest: 0 Smallest: 0"}
  - stdin: "5\n1\n2\n3\n4\n5\n"
    stdout: {pt: "Maior: 5 Menor: 1", en: "Largest: 5 Smallest: 1"}
comparacao: numeros
ordem_importa: true
requisitos:
  usa: [for]
  proibe: [max, min]
pistas:
  - {pt: "Lê o primeiro número antes do ciclo e usa-o como maior e menor inicial.", en: "Read the first number before the loop and use it as the starting largest and smallest."}
limite_tempo_s: 2
solucao_referencia:
  pt: |
    quantidade = 0
    numero = 0
    maior = 0
    menor = 0
    # input
    quantidade = int(input("Quantos números? "))
    numero = int(input("Número: "))
    maior = numero
    menor = numero
    # processamento
    for i in range(quantidade - 1):
        numero = int(input("Número: "))
        if numero > maior:
            maior = numero
        if numero < menor:
            menor = numero
    # output
    print(f"Maior: {maior} Menor: {menor}")
  en: |
    quantity = 0
    number = 0
    largest = 0
    smallest = 0
    # input
    quantity = int(input("How many numbers? "))
    number = int(input("Number: "))
    largest = number
    smallest = number
    # processing
    for i in range(quantity - 1):
        number = int(input("Number: "))
        if number > largest:
            largest = number
        if number < smallest:
            smallest = number
    # output
    print(f"Largest: {largest} Smallest: {smallest}")

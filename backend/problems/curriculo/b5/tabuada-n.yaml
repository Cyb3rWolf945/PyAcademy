# Ciclo for com impressão formatada (bloco 5, rio): tabuada de um número.
id: tabuada-n
titulo: {pt: "A tabuada do Tomás", en: "Tomás' times table"}
tipo: programa
bloco: "5"
regiao: rio
dificuldade: 3
origem: novo
estado: rascunho
enunciado:
  pt: |
    O Tomás está a estudar para o teste de Matemática e quer a tabuada de um número de 1 a 10 (inclui o 1 e o 10).
    Lê o número N e escreve as 10 linhas da tabuada, no formato: N x i = resultado (com i de 1 a 10).
    Entrada: um inteiro. Saída: 10 linhas.
  en: |
    Tomás is studying for the Maths test and wants the times table of a number from 1 to 10 (1 and 10 included).
    Read the number N and print the 10 lines of the times table, in the format: N x i = result (with i from 1 to 10).
    Input: one integer. Output: 10 lines.
exemplos:
  - stdin: "2\n"
    stdout: "2 x 1 = 2\n2 x 2 = 4\n2 x 3 = 6\n2 x 4 = 8\n2 x 5 = 10\n2 x 6 = 12\n2 x 7 = 14\n2 x 8 = 16\n2 x 9 = 18\n2 x 10 = 20"
testes:
  - stdin: "1\n"
    stdout: "1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n1 x 4 = 4\n1 x 5 = 5\n1 x 6 = 6\n1 x 7 = 7\n1 x 8 = 8\n1 x 9 = 9\n1 x 10 = 10"
  - stdin: "3\n"
    stdout: "3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n3 x 6 = 18\n3 x 7 = 21\n3 x 8 = 24\n3 x 9 = 27\n3 x 10 = 30"
  - stdin: "7\n"
    stdout: "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n7 x 6 = 42\n7 x 7 = 49\n7 x 8 = 56\n7 x 9 = 63\n7 x 10 = 70"
  - stdin: "10\n"
    stdout: "10 x 1 = 10\n10 x 2 = 20\n10 x 3 = 30\n10 x 4 = 40\n10 x 5 = 50\n10 x 6 = 60\n10 x 7 = 70\n10 x 8 = 80\n10 x 9 = 90\n10 x 10 = 100"
comparacao: numeros
ordem_importa: true
pistas:
  - {pt: "Um for com range(1, 11) percorre os i de 1 a 10.", en: "A for loop with range(1, 11) goes through i from 1 to 10."}
limite_tempo_s: 2
solucao_referencia: |
  n = 0
  # input
  n = int(input("Número: "))
  # processamento e output
  for i in range(1, 11):
      print(n, "x", i, "=", n * i)

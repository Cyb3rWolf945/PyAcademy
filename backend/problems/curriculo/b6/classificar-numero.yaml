# Função (bloco 6, torre): classificar um número com if/elif/else, devolvendo texto.
id: classificar-numero
titulo: {pt: "Positivo, negativo ou zero", en: "Positive, negative or zero"}
tipo: funcao
bloco: "6"
regiao: torre
dificuldade: 2
origem: novo
estado: rascunho
enunciado:
  pt: |
    Escreve a função classificar_numero(n) que recebe um número (inteiro ou decimal) e devolve um texto:
    "positivo" se for maior que 0, "negativo" se for menor que 0, e "zero" se for igual a 0.
    Devolve exatamente estas palavras (em português), tal como estão escritas.

    🧱 Requisito: tens de usar if / elif / else dentro da função.
  en: |
    Write the function classificar_numero(n) that receives a number (integer or decimal) and returns a text:
    "positivo" if it is greater than 0, "negativo" if it is less than 0, and "zero" if it is equal to 0.
    Return exactly these words (in Portuguese), as written.

    🧱 Requirement: you must use if / elif / else inside the function.
assinatura: "classificar_numero(n)"
exemplos:
  - args: [5]
    devolve: "positivo"
testes:
  - {args: [-3], devolve: "negativo"}
  - {args: [0], devolve: "zero"}
  - {args: [-0.5], devolve: "negativo"}
  - {args: [100], devolve: "positivo"}
comparacao: exato
ordem_importa: true
requisitos:
  usa: [if]
pistas:
  - {pt: "Testa primeiro n > 0, depois n < 0. O que sobra é zero.", en: "Test n > 0 first, then n < 0. What is left is zero."}
limite_tempo_s: 2
solucao_referencia: |
  def classificar_numero(n):
      if n > 0:
          return "positivo"
      elif n < 0:
          return "negativo"
      else:
          return "zero"

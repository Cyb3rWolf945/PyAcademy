# Função (bloco 6, torre): cálculo do troco como função que recebe dois parâmetros.
id: calcular-troco
titulo: {pt: "O troco da função", en: "The change, as a function"}
tipo: funcao
bloco: "6"
regiao: torre
dificuldade: 2
origem: novo
estado: rascunho
enunciado:
  pt: |
    Escreve a função calcular_troco(pago, compra) que recebe o valor que o cliente deu e o preço da compra (ambos números, com decimais).
    Deve devolver o troco, que é pago menos compra. Assume que o valor pago é sempre pelo menos igual ao preço. Usa return.
  en: |
    Write the function calcular_troco(pago, compra) that receives the amount the customer gave and the price of the purchase (both numbers, with decimals).
    It must return the change, which is paid minus purchase. Assume the amount paid is always at least the price. Use return.
assinatura: "calcular_troco(pago, compra)"
exemplos:
  - args: [20, 13.5]
    devolve: 6.5
testes:
  - {args: [5, 5], devolve: 0}
  - {args: [10, 7.3], devolve: 2.7}
  - {args: [50, 0.5], devolve: 49.5}
  - {args: [1, 0.01], devolve: 0.99}
comparacao: numeros
ordem_importa: true
pistas:
  - {pt: "A ordem dos parâmetros importa: o primeiro é o que o cliente deu.", en: "The order of the parameters matters: the first one is what the customer gave."}
limite_tempo_s: 2
solucao_referencia: |
  def calcular_troco(pago, compra):
      return pago - compra

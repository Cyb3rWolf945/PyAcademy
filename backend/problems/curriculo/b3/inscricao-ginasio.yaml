# Programa de decomposição (bloco 3, mercado): inscrição e mensalidade de um ginásio.
id: inscricao-ginasio
titulo: {pt: "Ginásio XPTO: inscrição e mensalidades", en: "XPTO gym: sign-up and monthly fees"}
tipo: programa
bloco: "3"
regiao: mercado
dificuldade: 2
origem: novo
estado: rascunho
enunciado:
  pt: |
    O ginásio XPTO cobra 25 € de inscrição por pessoa (paga-se uma vez) e 30 € de mensalidade por pessoa e por mês.
    Lê o número de pessoas da família inscrita e o número de meses que vão pagar, e escreve o total a pagar.
    Total = pessoas × (25 + 30 × meses). Entrada: duas linhas com inteiros (pessoas, meses). Saída: um número.
  en: |
    XPTO gym charges €25 sign-up per person (paid once) and €30 monthly fee per person per month.
    Read the number of people in the family enrolling and the number of months they will pay, and print the total to pay.
    Total = people × (25 + 30 × months). Input: two lines with integers (people, months). Output: one number.
exemplos:
  - stdin: "2\n3\n"
    stdout: "230"
testes:
  - stdin: "1\n1\n"
    stdout: "55"
  - stdin: "4\n12\n"
    stdout: "1540"
  - stdin: "1\n0\n"
    stdout: "25"
  - stdin: "3\n0\n"
    stdout: "75"
comparacao: numeros
ordem_importa: true
pistas:
  - {pt: "A inscrição é multiplicada pelas pessoas, tal como a mensalidade. Podes pôr a soma dentro de parênteses.", en: "The sign-up fee is multiplied by the people, just like the monthly fee. You can put the sum inside parentheses."}
limite_tempo_s: 2
solucao_referencia: |
  pessoas = 0
  meses = 0
  # input
  pessoas = int(input("Número de pessoas: "))
  meses = int(input("Número de meses: "))
  # processamento
  INSCRICAO = 25
  MENSALIDADE = 30
  total = pessoas * (INSCRICAO + MENSALIDADE * meses)
  # output
  print(total)

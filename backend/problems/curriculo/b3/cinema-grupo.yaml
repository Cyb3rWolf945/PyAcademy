# Programa de decomposição (bloco 3, mercado): desconto de grupo no cinema, só com aritmética.
id: cinema-grupo
titulo: {pt: "Cinema XPTO em grupo", en: "XPTO cinema group"}
tipo: programa
bloco: "3"
regiao: mercado
dificuldade: 4
origem: novo
estado: rascunho
enunciado:
  pt: |
    O bilhete do cinema XPTO custa 7,50 €. Quando se compra em grupo, o primeiro bilhete paga-se a preço cheio
    e cada um dos restantes tem 1 € de desconto.
    Lê o número de bilhetes (inteiro, pelo menos 1) e escreve o total a pagar, arredondado a 2 casas decimais.
    Total = 7,50 × bilhetes − 1 × (bilhetes − 1). Entrada: um inteiro. Saída: um número.
  en: |
    An XPTO cinema ticket costs €7.50. When buying as a group, the first ticket is paid at full price
    and each of the others gets €1 off.
    Read the number of tickets (integer, at least 1) and print the total to pay, rounded to 2 decimal places.
    Total = 7.50 × tickets − 1 × (tickets − 1). Input: one integer. Output: one number.
exemplos:
  - stdin: "4\n"
    stdout: "27"
testes:
  - stdin: "1\n"
    stdout: "7.5"
  - stdin: "2\n"
    stdout: "14"
  - stdin: "10\n"
    stdout: "66"
  - stdin: "3\n"
    stdout: "20.5"
comparacao: numeros
ordem_importa: true
pistas:
  - {pt: "Quantos bilhetes têm desconto? Todos menos um.", en: "How many tickets get the discount? All except one."}
limite_tempo_s: 2
solucao_referencia: |
  bilhetes = 0
  # input
  bilhetes = int(input("Número de bilhetes: "))
  # processamento
  PRECO_BILHETE = 7.5
  DESCONTO_GRUPO = 1
  total = PRECO_BILHETE * bilhetes - DESCONTO_GRUPO * (bilhetes - 1)
  # output
  print(round(total, 2))

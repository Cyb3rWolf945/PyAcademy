# Condicionais (bloco 4, encruzilhada): decisão a partir de um tempo calculado.
id: fila-cantina
titulo: {pt: "Fila da cantina", en: "Canteen queue"}
tipo: programa
bloco: "4"
regiao: encruzilhada
dificuldade: 2
origem: novo
estado: rascunho
enunciado:
  pt: |
    Na cantina, cada pessoa à frente na fila demora 2 minutos. Lê o número de pessoas à tua frente (inteiro, zero ou positivo).
    Calcula o tempo de espera e decide:
    se a espera for de 10 minutos ou menos, escreve "Entra na fila já";
    se for mais de 10 e até 20 minutos, escreve "Come uma torrada antes";
    se for mais de 20 minutos, escreve "Vai ao café do lado".
    Entrada: um inteiro. Saída: uma linha.
  en: |
    In the canteen, each person ahead of you in the queue takes 2 minutes. Read the number of people ahead of you (integer, zero or positive).
    Work out the waiting time and decide:
    if the wait is 10 minutes or less, print "Join the queue now";
    if it is more than 10 and up to 20 minutes, print "Grab a toast first";
    if it is more than 20 minutes, print "Go to the café next door".
    Input: one integer. Output: one line.
exemplos:
  - stdin: "3\n"
    stdout: {pt: "Entra na fila já", en: "Join the queue now"}
testes:
  - stdin: "0\n"
    stdout: {pt: "Entra na fila já", en: "Join the queue now"}
  - stdin: "5\n"
    stdout: {pt: "Entra na fila já", en: "Join the queue now"}
  - stdin: "6\n"
    stdout: {pt: "Come uma torrada antes", en: "Grab a toast first"}
  - stdin: "10\n"
    stdout: {pt: "Come uma torrada antes", en: "Grab a toast first"}
  - stdin: "11\n"
    stdout: {pt: "Vai ao café do lado", en: "Go to the café next door"}
comparacao: texto
ordem_importa: true
pistas:
  - {pt: "Calcula primeiro o tempo = pessoas × 2 e compara esse tempo com 10 e com 20.", en: "First compute the time = people × 2 and compare that time with 10 and with 20."}
limite_tempo_s: 2
solucao_referencia:
  pt: |
    pessoas = 0
    tempo = 0
    # input
    pessoas = int(input("Pessoas à frente na fila: "))
    # processamento
    TEMPO_POR_PESSOA = 2
    tempo = pessoas * TEMPO_POR_PESSOA
    # output
    if tempo <= 10:
        print("Entra na fila já")
    elif tempo <= 20:
        print("Come uma torrada antes")
    else:
        print("Vai ao café do lado")
  en: |
    people = 0
    time = 0
    # input
    people = int(input("People ahead of you: "))
    # processing
    TIME_PER_PERSON = 2
    time = people * TIME_PER_PERSON
    # output
    if time <= 10:
        print("Join the queue now")
    elif time <= 20:
        print("Grab a toast first")
    else:
        print("Go to the café next door")

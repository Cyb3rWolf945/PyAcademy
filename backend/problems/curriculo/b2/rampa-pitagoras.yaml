# Variação do teorema de Pitágoras da aula dos bombeiros (bloco 2): comprimento de uma rampa com math.sqrt.
id: rampa-pitagoras
titulo: {pt: "A rampa do skate", en: "The skate ramp"}
tipo: programa
bloco: "2"
regiao: floresta
dificuldade: 3
origem: variacao_aula
estado: rascunho
enunciado:
  pt: |
    A câmara quer uma rampa de acesso ao pavilhão de skate. Conheces a base (distância horizontal) e a altura, em metros.
    O comprimento da rampa é a hipotenusa do triângulo: raiz quadrada de (base² + altura²). Usa import math e math.sqrt.
    Lê a base e a altura (uma por linha) e escreve o comprimento arredondado a duas casas decimais.
    Entrada: duas linhas com números. Saída: um número.
  en: |
    The council wants an access ramp for the skate park. You know the base (horizontal distance) and the height, in metres.
    The length of the ramp is the hypotenuse of the triangle: the square root of (base² + height²). Use import math and math.sqrt.
    Read the base and the height (one per line) and print the length rounded to two decimal places.
    Input: two lines with numbers. Output: one number.
exemplos:
  - stdin: "3\n4\n"
    stdout: "5.0"
testes:
  - stdin: "5\n12\n"
    stdout: "13.0"
  - stdin: "1\n1\n"
    stdout: "1.41"
  - stdin: "0.5\n2\n"
    stdout: "2.06"
  - stdin: "6\n8\n"
    stdout: "10.0"
  - stdin: "0\n3\n"
    stdout: "3.0"
comparacao: numeros
ordem_importa: true
pistas:
  - {pt: "Eleva cada medida ao quadrado com ** 2 e tira a raiz com math.sqrt.", en: "Square each measure with ** 2 and take the root with math.sqrt."}
limite_tempo_s: 2
solucao_referencia: |
  import math
  base = 0.0
  altura = 0.0
  # input
  base = float(input("Base em metros: "))
  altura = float(input("Altura em metros: "))
  # processamento
  comprimento = math.sqrt(base ** 2 + altura ** 2)
  # output
  print(round(comprimento, 2))

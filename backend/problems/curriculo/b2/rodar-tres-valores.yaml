# Variação da troca de valores com aux (bloco 2): rotação de três valores.
id: rodar-tres-valores
titulo: {pt: "Roda a fila", en: "Rotate the queue"}
tipo: programa
bloco: "2"
regiao: floresta
dificuldade: 3
origem: variacao_aula
estado: rascunho
enunciado:
  pt: |
    Tens três valores guardados em a, b e c. O teu professor quer rodá-los uma posição para a esquerda:
    o valor de a passa para b, o de b passa para c e o de c passa para a. Usa uma variável auxiliar (aux) para não perderes nenhum valor.
    Lê os três números inteiros (um por linha) e escreve os três valores finais separados por espaços.
    Entrada: três linhas com inteiros. Saída: uma linha com os três valores finais.
  en: |
    You have three values stored in a, b and c. Your teacher wants to rotate them one position to the left:
    the value of a goes to b, the value of b goes to c and the value of c goes to a. Use an auxiliary variable (aux) so you do not lose any value.
    Read the three integers (one per line) and print the three final values separated by spaces.
    Input: three lines with integers. Output: one line with the three final values.
exemplos:
  - stdin: "1\n2\n3\n"
    stdout: "2 3 1"
testes:
  - stdin: "5\n5\n5\n"
    stdout: "5 5 5"
  - stdin: "-1\n0\n10\n"
    stdout: "0 10 -1"
  - stdin: "7\n3\n9\n"
    stdout: "3 9 7"
  - stdin: "100\n-100\n0\n"
    stdout: "-100 0 100"
comparacao: numeros
ordem_importa: true
pistas:
  - {pt: "Guarda primeiro o valor de a em aux, antes de o substituir.", en: "Save the value of a in aux first, before replacing it."}
limite_tempo_s: 2
solucao_referencia: |
  a = 0
  b = 0
  c = 0
  aux = 0
  # input
  a = int(input("Valor a: "))
  b = int(input("Valor b: "))
  c = int(input("Valor c: "))
  # processamento
  aux = a
  a = b
  b = c
  c = aux
  # output
  print(a, b, c)

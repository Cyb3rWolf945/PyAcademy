# Problema exemplo (bloco 6, funções): chamadas com argumentos e valor devolvido.
id: calcular-media
titulo:
  pt: A média do café
  en: The coffee average
tipo: funcao
bloco: 6
regiao: oficina
dificuldade: 1
origem: novo
estado: aprovado
enunciado:
  pt: |
    O café da faculdade quer saber quantos cafés vende por dia, em média.
    Escreve a função `calcular_media(valores)` que recebe uma lista de números e devolve a média.
    Se a lista estiver vazia, devolve 0.
  en: |
    The campus café wants to know how many coffees it sells per day, on average.
    Write the function `calcular_media(valores)` that receives a list of numbers and returns their average.
    If the list is empty, return 0.
assinatura: calcular_media(valores)
exemplos:
  - args: [[10, 20, 30]]
    devolve: 20
testes:
  - args: [[1, 2]]
    devolve: 1.5
  - args: [[]]
    devolve: 0
  - args: [[7]]
    devolve: 7
comparacao: numeros
requisitos:
  define_funcao: {nome: calcular_media, parametros: 1}
pistas:
  - pt: "Soma tudo e divide pelo número de elementos. Cuidado com a lista vazia."
    en: "Add everything up and divide by the number of items. Watch out for the empty list."
erros_comuns: []
limite_tempo_s: 2
solucao_referencia: |
  def calcular_media(valores):
      total = 0
      if len(valores) == 0:
          return 0
      for valor in valores:
          total = total + valor
      return total / len(valores)

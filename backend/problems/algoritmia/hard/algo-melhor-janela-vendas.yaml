# Arena de Algoritmia (hard): A melhor semana do bar. Gerado em rascunho; revisão do professor pendente.
id: algo-melhor-janela-vendas
titulo:
  pt: A melhor semana do bar
  en: The bar's best stretch
tipo: funcao
bloco: mais_alem
regiao: ilhas
dificuldade: 1
origem: mais_alem
estado: rascunho
nivel_algo: hard
enunciado:
  pt: |
    O bar da faculdade registou o lucro de cada dia (pode ser negativo, nos dias de greve). O dono quer saber qual foi a melhor sequência de `k` dias **seguidos**.

    Escreve `melhor_janela(vendas, k)`, que devolve a maior soma possível de `k` dias consecutivos. Garante-se que `1 ≤ k ≤ len(vendas)`.

    **Exemplo:** `vendas = [1, 3, -2, 8, 4]`, `k = 3` devolve `10`, porque `-2 + 8 + 4 = 10` é melhor que `1 + 3 - 2 = 2` e que `3 - 2 + 8 = 9`.
  en: |
    The campus bar recorded each day's profit (it may be negative, on strike days). The owner wants to know the best run of `k` **consecutive** days.

    Write `melhor_janela(vendas, k)`, which returns the largest possible sum of `k` consecutive days. It is guaranteed that `1 ≤ k ≤ len(vendas)`.

    **Example:** `vendas = [1, 3, -2, 8, 4]`, `k = 3` returns `10`, because `-2 + 8 + 4 = 10` beats `1 + 3 - 2 = 2` and `3 - 2 + 8 = 9`.
assinatura: melhor_janela(vendas, k)
restricoes:
  pt: 1 ≤ k ≤ len(vendas) ≤ 10^5; |vendas[i]| ≤ 10^4
  en: 1 ≤ k ≤ len(vendas) ≤ 10^5; |vendas[i]| ≤ 10^4
exemplos:
- args: [[1, 3, -2, 8, 4], 3]
  devolve: 10
testes:
- args: [[1, 3, -2, 8, 4], 3]
  devolve: 10
- args: [[5], 1]
  devolve: 5
- args: [[-3, -1, -2], 2]
  devolve: -3
- args: [[1, 2, 3], 3]
  devolve: 6
- args: [[4, 4, 4, 4], 2]
  devolve: 8
- args: [[0, 0, 0], 1]
  devolve: 0
- args: [[10, -20, 10], 1]
  devolve: 10
- args_gerador: '[[(i * 7919) % 1003 - 300 for i in range(100000)], 50000]'
comparacao: numeros
ordem_importa: true
pistas:
- pt: 'Quando a janela avança um dia, entra um valor e sai outro: não precisas de somar tudo outra vez.'
  en: 'When the window moves one day, one value enters and one leaves: you do not need to add everything again.'
erros_comuns: []
limite_tempo_s: 2
solucao_referencia: |
  def melhor_janela(vendas, k):
      atual = sum(vendas[:k])
      melhor = atual
      for i in range(k, len(vendas)):
          atual = atual + vendas[i] - vendas[i - k]
          if atual > melhor:
              melhor = atual
      return melhor
solucao_ingenua: |
  def melhor_janela(vendas, k):
      melhor = None
      for i in range(len(vendas) - k + 1):
          soma = sum(vendas[i:i + k])
          if melhor is None or soma > melhor:
              melhor = soma
      return melhor
editorial:
  pt: |
    **Ideia:** janela deslizante. Calcula a soma da primeira janela e, a cada passo, soma o novo dia e subtrai o que saiu.

    **Passos:** 1) `atual = sum(vendas[:k])`; 2) para `i` de `k` até ao fim: `atual += vendas[i] - vendas[i-k]`; 3) guardar o máximo.

    **Complexidade:** tempo O(n), espaço O(1).

    **Porque é que a ingénua falha:** somar cada janela de raiz custa O(n·k). Com n = 10^5 e k = 5·10^4 são 2,5·10^9 somas.
  en: |
    **Idea:** sliding window. Compute the sum of the first window and, at each step, add the new day and subtract the one that left.

    **Steps:** 1) `atual = sum(vendas[:k])`; 2) for `i` from `k` to the end: `atual += vendas[i] - vendas[i-k]`; 3) keep the maximum.

    **Complexity:** time O(n), space O(1).

    **Why the naive one is slow:** re-summing every window from scratch costs O(n·k). With n = 10^5 and k = 5·10^4 that is 2.5·10^9 additions.

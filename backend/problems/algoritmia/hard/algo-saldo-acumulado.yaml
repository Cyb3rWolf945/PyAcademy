# Arena de Algoritmia (hard): Saldo do cartão da cantina. Gerado em rascunho; revisão do professor pendente.
id: algo-saldo-acumulado
titulo:
  pt: Saldo do cartão da cantina
  en: Canteen card balance
tipo: funcao
bloco: mais_alem
regiao: ilhas
dificuldade: 1
origem: mais_alem
estado: rascunho
nivel_algo: hard
enunciado:
  pt: |
    O cartão da cantina regista os movimentos de cada dia (carregamentos positivos, refeições negativas). Queres o saldo **depois de cada movimento**.

    Escreve `soma_acumulada(movimentos)`, que devolve uma lista do mesmo tamanho em que o elemento `i` é a soma de `movimentos[0]` até `movimentos[i]`. A ordem importa.

    **Exemplo:** `[5, -2, 4, -1]` devolve `[5, 3, 7, 6]`.
  en: |
    The canteen card records each day's movements (positive top-ups, negative meals). You want the balance **after each movement**.

    Write `soma_acumulada(movimentos)`, which returns a list of the same size where element `i` is the sum of `movimentos[0]` up to `movimentos[i]`. The order matters.

    **Example:** `[5, -2, 4, -1]` returns `[5, 3, 7, 6]`.
assinatura: soma_acumulada(movimentos)
restricoes:
  pt: 0 ≤ len(movimentos) ≤ 10^5; |movimentos[i]| ≤ 10^4
  en: 0 ≤ len(movimentos) ≤ 10^5; |movimentos[i]| ≤ 10^4
exemplos:
- args: [[5, -2, 4, -1]]
  devolve: [5, 3, 7, 6]
testes:
- args: [[5, -2, 4, -1]]
  devolve: [5, 3, 7, 6]
- args: [[]]
  devolve: []
- args: [[7]]
  devolve: [7]
- args: [[0, 0, 0]]
  devolve: [0, 0, 0]
- args: [[-1, -2, -3]]
  devolve: [-1, -3, -6]
- args: [[1, 1, 1, 1, 1]]
  devolve: [1, 2, 3, 4, 5]
- args: [[10, -10, 10]]
  devolve: [10, 0, 10]
- args_gerador: '[[(i * 7919) % 2001 - 1000 for i in range(100000)]]'
comparacao: exato
ordem_importa: true
pistas:
- pt: Cada saldo é o saldo anterior mais o movimento atual.
  en: Each balance is the previous balance plus the current movement.
erros_comuns: []
limite_tempo_s: 2
solucao_referencia: |
  def soma_acumulada(movimentos):
      res = []
      saldo = 0
      for m in movimentos:
          saldo += m
          res.append(saldo)
      return res
solucao_ingenua: |
  def soma_acumulada(movimentos):
      res = []
      for i in range(len(movimentos)):
          res.append(sum(movimentos[:i + 1]))
      return res
editorial:
  pt: |
    **Ideia:** cada soma acumulada reaproveita a anterior: `saldo[i] = saldo[i-1] + movimentos[i]`.

    **Passos:** 1) `saldo = 0`; 2) para cada movimento, somar e acrescentar ao resultado.

    **Complexidade:** tempo O(n), espaço O(n) para o resultado.

    **Porque é que a ingénua falha:** recalcular `sum(movimentos[:i+1])` de raiz a cada posição soma 1 + 2 + ... + n elementos, isto é, O(n²).
  en: |
    **Idea:** each running sum reuses the previous one: `saldo[i] = saldo[i-1] + movimentos[i]`.

    **Steps:** 1) `saldo = 0`; 2) for each movement, add and append to the result.

    **Complexity:** time O(n), space O(n) for the result.

    **Why the naive one is slow:** recomputing `sum(movimentos[:i+1])` from scratch at each position adds 1 + 2 + ... + n elements, i.e. O(n²).

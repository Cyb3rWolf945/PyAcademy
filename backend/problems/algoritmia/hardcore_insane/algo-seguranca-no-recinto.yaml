# Arena de Algoritmia (hardcore_insane): Seguranças no recinto. Gerado em rascunho; revisão do professor pendente.
id: algo-seguranca-no-recinto
titulo:
  pt: Seguranças no recinto
  en: Security guards on the grounds
tipo: funcao
bloco: mais_alem
regiao: ilhas
dificuldade: 5
origem: mais_alem
estado: rascunho
nivel_algo: hardcore_insane
enunciado:
  pt: |
    O recinto de um festival é um quadrado de `n × n` casas. A organização quer colocar `n` seguranças, **um por linha e um por coluna**, de modo que **nenhum veja outro**: dois seguranças veem-se se estiverem na mesma linha, na mesma coluna ou na mesma **diagonal** (em qualquer dos dois sentidos).

    Escreve `contar_disposicoes(n)`, que devolve de quantas maneiras diferentes se podem colocar os `n` seguranças. `n = 1` devolve `1`; `n = 2` e `n = 3` devolvem `0`.

    **Exemplo:** `contar_disposicoes(4)` devolve `2` (as duas disposições são espelhos uma da outra). Para `n = 6` devolve `4`.
  en: |
    A festival's grounds are an `n × n` square of cells. The organisation wants to place `n` guards, **one per row and one per column**, so that **none sees another**: two guards see each other if they are in the same row, the same column or the same **diagonal** (in either direction).

    Write `contar_disposicoes(n)`, which returns in how many different ways the `n` guards can be placed. `n = 1` returns `1`; `n = 2` and `n = 3` return `0`.

    **Example:** `contar_disposicoes(4)` returns `2` (the two arrangements are mirrors of each other). For `n = 6` it returns `4`.

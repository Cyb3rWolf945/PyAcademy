pistas:
- pt: 'Backtracking: coloca um segurança por linha, tentando cada coluna livre; recua quando uma coluna ou diagonal já está ocupada.'
  en: 'Backtracking: place one guard per row, trying each free column; backtrack when a column or diagonal is already taken.'
- pt: Guarda as colunas e as duas diagonais ocupadas (por exemplo com conjuntos, ou com bits) para testar cada posição em O(1).
  en: Store the occupied columns and the two diagonals (for example in sets, or with bits) to test each position in O(1).
erros_comuns: []
limite_tempo_s: 2
solucao_referencia: |
  def contar_disposicoes(n):
      cheio = (1 << n) - 1

      def colocar(colunas, diag1, diag2):
          if colunas == cheio:
              return 1
          total = 0
          livres = cheio & ~(colunas | diag1 | diag2)
          while livres:
              bit = livres & -livres
              livres -= bit
              total += colocar(colunas | bit, ((diag1 | bit) << 1) & cheio, (diag2 | bit) >> 1)
          return total

      return colocar(0, 0, 0)
solucao_ingenua: |
  from itertools import permutations

  def contar_disposicoes(n):
      total = 0
      for p in permutations(range(n)):
          ok = True
          for i in range(n):
              for j in range(i + 1, n):
                  if abs(p[i] - p[j]) == j - i:
                      ok = False
                      break
              if not ok:
                  break
          if ok:
              total += 1
      return total
editorial:
  pt: |
    **Ideia:** backtracking linha a linha. Como há um segurança por linha, escolhe-se a coluna de cada um; só se aceitam colunas e diagonais ainda livres. Quando uma linha não tem opção, recua-se (poda). Aqui as colunas e as diagonais ocupadas guardam-se como bits de um inteiro, o que torna cada teste O(1).

    **Passos:** 1) `colocar(colunas, diag1, diag2)` conta as formas de preencher as linhas que faltam; 2) `livres` = colunas onde ainda se pode pôr; 3) para cada bit livre, ocupar e deslocar as diagonais (`<< 1` e `>> 1`) para a linha seguinte; 4) se todas as colunas estão ocupadas, é uma solução.

    **Complexidade:** tempo exponencial, mas muito inferior a `n!` graças à poda (para n = 11 visitam-se algumas centenas de milhares de estados); espaço O(n).

    **Porque é que a ingénua falha:** gerar todas as `n!` permutações e testá-las uma a uma gera quase 40 milhões de candidatos para n = 11, cada um com uma verificação O(n²).
  en: |
    **Idea:** row-by-row backtracking. Since there is one guard per row, we choose each one's column; only columns and diagonals still free are accepted. When a row has no option, we backtrack (pruning). Here the occupied columns and diagonals are stored as bits of an integer, making each test O(1).

    **Steps:** 1) `colocar(colunas, diag1, diag2)` counts the ways to fill the remaining rows; 2) `livres` = columns where one can still place; 3) for each free bit, occupy it and shift the diagonals (`<< 1` and `>> 1`) to the next row; 4) if all columns are occupied, it is a solution.

    **Complexity:** exponential time, but far below `n!` thanks to pruning (for n = 11 it visits a few hundred thousand states); space O(n).

    **Why the naive one is slow:** generating all `n!` permutations and testing them one by one produces almost 40 million candidates for n = 11, each with an O(n²) check.

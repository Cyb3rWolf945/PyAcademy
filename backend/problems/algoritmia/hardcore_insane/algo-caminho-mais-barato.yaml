- args: [4, [[0, 1, 4], [0, 2, 1], [2, 1, 2], [1, 3, 5]], 0, 3]
  devolve: 8
testes:
- args: [4, [[0, 1, 4], [0, 2, 1], [2, 1, 2], [1, 3, 5]], 0, 3]
  devolve: 8

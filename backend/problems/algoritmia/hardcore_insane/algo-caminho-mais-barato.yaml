# Arena de Algoritmia (hardcore_insane): O caminho mais barato. Gerado em rascunho; revisão do professor pendente.
id: algo-caminho-mais-barato
titulo:
  pt: O caminho mais barato
  en: The cheapest route
tipo: funcao
bloco: mais_alem
regiao: ilhas
dificuldade: 5
origem: mais_alem
estado: rascunho
nivel_algo: hardcore_insane
enunciado:
  pt: |
    A rede de comboios regionais tem `n` estações numeradas de `0` a `n-1`. Cada ligação `[a, b, custo]` pode ser feita nos **dois sentidos** pelo mesmo custo (número inteiro positivo; pode haver várias ligações entre as mesmas estações). Queres a viagem mais barata entre duas estações.

    Escreve `caminho_mais_barato(n, ligacoes, origem, destino)`, que devolve o custo total mínimo, ou `-1` se não houver caminho. Se `origem == destino`, o custo é `0`.

    **Exemplo:** `n = 4`, `ligacoes = [[0,1,4],[0,2,1],[2,1,2],[1,3,5]]`, de `0` a `3` devolve `8`, pelo caminho `0 → 2 → 1 → 3` (`1 + 2 + 5`), que é mais barato do que `0 → 1 → 3` (`4 + 5 = 9`).
  en: |
    The regional train network has `n` stations numbered `0` to `n-1`. Each link `[a, b, custo]` can be travelled in **both directions** for the same cost (a positive integer; there may be several links between the same stations). You want the cheapest trip between two stations.

    Write `caminho_mais_barato(n, ligacoes, origem, destino)`, which returns the minimum total cost, or `-1` if there is no path. If `origem == destino`, the cost is `0`.

    **Example:** `n = 4`, `ligacoes = [[0,1,4],[0,2,1],[2,1,2],[1,3,5]]`, from `0` to `3` returns `8`, via `0 → 2 → 1 → 3` (`1 + 2 + 5`), which is cheaper than `0 → 1 → 3` (`4 + 5 = 9`).
assinatura: caminho_mais_barato(n, ligacoes, origem, destino)
restricoes:
  pt: 1 ≤ n ≤ 2·10^4; 0 ≤ len(ligacoes) ≤ 10^5; 1 ≤ custo ≤ 10^4
  en: 1 ≤ n ≤ 2·10^4; 0 ≤ len(ligacoes) ≤ 10^5; 1 ≤ cost ≤ 10^4

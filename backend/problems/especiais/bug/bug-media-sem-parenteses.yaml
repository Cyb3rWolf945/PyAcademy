- stdin: '10

    10

    10

    '
  stdout: '10.0'
- stdin: '0

    0

    0

    '
  stdout: '0.0'
- stdin: '20

    0

    0

    '
  stdout: '6.67'
- stdin: '9.5

    13

    18

    '
  stdout: '13.5'
comparacao: numeros
pistas:
- pt: 'Qual operação é feita primeiro: a soma ou a divisão? Lembra-te da prioridade dos operadores.'
  en: 'Which operation is done first: the sum or the division? Remember operator precedence.'
limite_tempo_s: 2
solucao_referencia: |
  NUMERO_NOTAS = 3

  nota1 = 0
  nota2 = 0
  nota3 = 0

  # input
  nota1 = float(input("Nota 1: "))
  nota2 = float(input("Nota 2: "))
  nota3 = float(input("Nota 3: "))

  # processamento
  media = (nota1 + nota2 + nota3) / NUMERO_NOTAS

  # output
  print(round(media, 2))

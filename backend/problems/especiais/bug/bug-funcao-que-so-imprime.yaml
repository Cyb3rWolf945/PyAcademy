# Problema bug gerado (bug); rascunho à espera de revisão do professor.
id: bug-funcao-que-so-imprime
titulo:
  pt: 'Bug: o IVA que ninguém recebe'
  en: 'Bug: the VAT nobody receives'
tipo: bug
bloco: '6'
regiao: torre
dificuldade: 2
origem: novo
estado: rascunho
enunciado:
  pt: |-
    A função `preco_com_iva(preco)` devia **devolver** o preço com IVA de 23%, mas só o escreve no ecrã e devolve `None` (quem a chama fica a ver navios). Corrige-a.

    Recebe o preço (número) e devolve o preço final, com o IVA incluído.
  en: |-
    The function `preco_com_iva(preco)` should **return** the price with 23% VAT, but it only prints it on screen and returns `None` (whoever calls it is left empty-handed). Fix it.

    It receives the price (a number) and returns the final price, VAT included.
codigo_inicial: |
  def preco_com_iva(preco):
      TAXA_IVA = 0.23
      preco_final = preco + preco * TAXA_IVA
      print(preco_final)
assinatura: preco_com_iva(preco)
exemplos:
- &id001
  args:
  - 10
  devolve: 12.3
testes:
- *id001
- args:
  - 0
  devolve: 0.0
- args:
  - 100
  devolve: 123.0
- args:
  - 4.5
  devolve: 5.535
- args:
  - 1
  devolve: 1.23
comparacao: numeros
pistas:
- pt: print mostra no ecrã, mas quem chama a função precisa do valor de volta. Qual a palavra-chave que devolve?
  en: print shows on screen, but whoever calls the function needs the value back. Which keyword returns it?
limite_tempo_s: 2
solucao_referencia: |
  def preco_com_iva(preco):
      TAXA_IVA = 0.23
      preco_final = preco + preco * TAXA_IVA
      return preco_final

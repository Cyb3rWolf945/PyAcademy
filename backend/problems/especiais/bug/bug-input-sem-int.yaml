comparacao: numeros
pistas:
- pt: O que devolve input()? Texto (str). E o que faz o + com dois textos?
  en: What does input() return? Text (str). And what does + do with two pieces of text?
limite_tempo_s: 2
solucao_referencia: |
  PRECO_PIZZA = 6

  pizzas_ana = 0
  pizzas_rui = 0
  total_pizzas = 0

  # input
  pizzas_ana = int(input("Pizzas da Ana: "))
  pizzas_rui = int(input("Pizzas do Rui: "))

  # processamento
  total_pizzas = pizzas_ana + pizzas_rui
  a_pagar = total_pizzas * PRECO_PIZZA

  # output
  print(total_pizzas)
  print(a_pagar)

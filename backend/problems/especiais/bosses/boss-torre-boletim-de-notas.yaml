# Problema programa gerado (bosses); rascunho à espera de revisão do professor.
id: boss-torre-boletim-de-notas
titulo:
  pt: 'Boss da Torre: o boletim de notas'
  en: 'Tower Boss: the grade report'
tipo: programa
bloco: '6'
regiao: torre
dificuldade: 5
origem: boss
estado: rascunho
enunciado:
  pt: |
    A secretaria quer um boletim automático e o programa já saiu do Word em formato de esparguete. Vais arrumá-lo em **funções** (o professor agradece e o teu eu do futuro também).

    Lê, uma por linha, três notas inteiras de 0 a 20: **teórica**, **prática** e **projeto**. A média final é ponderada com pesos **3, 3 e 4** (a soma dos pesos é 10): `(teórica*3 + prática*3 + projeto*4) / 10`.

    Escreve três linhas:
    1. a média, arredondada a 1 casa decimal com `round(media, 1)`;
    2. a classificação qualitativa: `Excelente` (média >= 18), `Bom` (>= 14), `Suficiente` (>= 10) ou `Insuficiente`;
    3. `Aprovado` se a média for >= 10, senão `Reprovado`.

    Sugestão de arrumação: uma função `calcular_media`, outra `classificar` e outra `esta_aprovado`, e um programa principal que só lê, chama e escreve.
  en: |
    The admin office wants an automatic grade report and the program came out of Word in spaghetti format. You will tidy it up with **functions** (your teacher says thanks and so does your future self).

    Read, one per line, three integer marks from 0 to 20: **theory**, **practice** and **project**. The final average is weighted with weights **3, 3 and 4** (the weights add up to 10): `(theory*3 + practice*3 + project*4) / 10`.

    Print three lines:
    1. the average, rounded to 1 decimal place with `round(average, 1)`;
    2. the qualitative grade (in Portuguese): `Excelente` (average >= 18), `Bom` (>= 14), `Suficiente` (>= 10) or `Insuficiente`;
    3. `Aprovado` (passed) if the average is >= 10, otherwise `Reprovado` (failed).

    Suggested layout: a function `calcular_media`, another `classificar` and another `esta_aprovado`, and a main program that only reads, calls and prints.
exemplos:
- &id001
  stdin: '17

    15

    19

    '
  stdout: |-
    17.2
    Bom
    Aprovado

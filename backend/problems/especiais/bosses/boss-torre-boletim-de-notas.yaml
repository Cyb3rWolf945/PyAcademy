- *id001
comparacao: texto
pistas:
- pt: Cada função faz uma só coisa e devolve (return) o resultado. O programa principal é que escreve com print.
  en: Each function does one thing and returns the result. It is the main program that prints.
- pt: 'Se obténs 13.399999 usaste 0.3 e 0.4: usa os pesos inteiros 3, 3 e 4 e divide por 10 no fim.'
  en: 'If you get 13.399999 you used 0.3 and 0.4: use the whole-number weights 3, 3, 4 and divide by 10 at the end.'
limite_tempo_s: 2
solucao_referencia:
  pt: |
    PESO_TEORICA = 3
    PESO_PRATICA = 3
    PESO_PROJETO = 4
    SOMA_PESOS = 10
    NOTA_MINIMA = 10


    def calcular_media(teorica, pratica, projeto):
        return (teorica * PESO_TEORICA + pratica * PESO_PRATICA + projeto * PESO_PROJETO) / SOMA_PESOS


    def classificar(media):
        if media >= 18:
            return "Excelente"
        elif media >= 14:
            return "Bom"
        elif media >= 10:
            return "Suficiente"
        return "Insuficiente"


    def esta_aprovado(media):
        return media >= NOTA_MINIMA


    teorica = 0
    pratica = 0
    projeto = 0

    # input
    teorica = int(input("Nota teórica: "))
    pratica = int(input("Nota prática: "))
    projeto = int(input("Nota do projeto: "))

    # processamento
    media = calcular_media(teorica, pratica, projeto)

    # output
    print(round(media, 1))
    print(classificar(media))
    if esta_aprovado(media):
        print("Aprovado")
    else:
        print("Reprovado")
  en: |
    WEIGHT_THEORY = 3
    WEIGHT_PRACTICE = 3
    WEIGHT_PROJECT = 4
    WEIGHT_SUM = 10
    MINIMUM_MARK = 10


    def calculate_average(theory, practice, project):
        return (theory * WEIGHT_THEORY + practice * WEIGHT_PRACTICE + project * WEIGHT_PROJECT) / WEIGHT_SUM


    def classify(average):
        if average >= 18:
            return "Excelente"
        elif average >= 14:
            return "Bom"
        elif average >= 10:
            return "Suficiente"
        return "Insuficiente"


    def has_passed(average):
        return average >= MINIMUM_MARK


    theory = 0
    practice = 0
    project = 0

    # input
    theory = int(input("Theory mark: "))
    practice = int(input("Practice mark: "))
    project = int(input("Project mark: "))

    # processing
    average = calculate_average(theory, practice, project)

    # output
    print(round(average, 1))
    print(classify(average))
    if has_passed(average):
        print("Aprovado")
    else:
        print("Reprovado")

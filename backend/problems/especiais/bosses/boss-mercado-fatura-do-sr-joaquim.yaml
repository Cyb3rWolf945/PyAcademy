# Problema programa gerado (bosses); rascunho à espera de revisão do professor.
id: boss-mercado-fatura-do-sr-joaquim
titulo:
  pt: 'Boss do Mercado: a fatura do Sr. Joaquim'
  en: 'Market Boss: Mr. Joaquim''s invoice'
tipo: programa
bloco: '3'
regiao: mercado
dificuldade: 5
origem: boss
estado: rascunho
enunciado:
  pt: |
    O Sr. Joaquim, do minimercado da esquina, perdeu a calculadora (anda a ver se está atrás do queijo). Ajuda-o a fazer a fatura!

    Lê, uma por linha, a quantidade (inteira) de **pães**, de **pacotes de leite** e de **queijos** que o cliente leva.

    Preços e regras fixas (são constantes!):
    - pão: 0,30 €; leite: 0,85 €; queijo: 3,20 €;
    - desconto de cliente de **5%** sobre o subtotal;
    - IVA de **6%** sobre o valor já com desconto;
    - cada saco de plástico custa 0,10 € e cabem **6 artigos** por saco. Usa o número mínimo de sacos (7 artigos precisam de 2 sacos; 0 artigos, de nenhum).

    Escreve cinco linhas, arredondadas a 2 casas decimais (os sacos são um número inteiro):
    `Subtotal:`, `Desconto:`, `IVA:`, `Sacos:` (quantos), `Total:` (subtotal - desconto + IVA + custo dos sacos).
  en: |
    Mr. Joaquim, from the corner shop, lost his calculator (he is checking behind the cheese). Help him make the invoice!

    Read, one per line, the (integer) quantity of **bread rolls**, **milk cartons** and **cheeses** the customer is buying.

    Fixed prices and rules (they are constants!):
    - bread roll: 0.30 €; milk: 0.85 €; cheese: 3.20 €;
    - a customer discount of **5%** on the subtotal;
    - **6%** VAT on the already discounted value;
    - each plastic bag costs 0.10 € and holds **6 items**. Use the minimum number of bags (7 items need 2 bags; 0 items need none).

    Print five lines, rounded to 2 decimal places (bags is a whole number):
    `Subtotal:`, `Discount:`, `VAT:`, `Bags:` (how many), `Total:` (subtotal - discount + VAT + cost of the bags).

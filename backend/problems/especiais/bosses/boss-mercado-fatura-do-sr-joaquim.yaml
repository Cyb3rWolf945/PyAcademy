comparacao: numeros
pistas:
- pt: 'Para o número de sacos usa // : (artigos + 5) // 6 arredonda para cima. Põe o 6 e o 0,10 em constantes.'
  en: 'For the bags use // : (items + 5) // 6 rounds up. Put the 6 and the 0.10 in constants.'
- pt: O IVA incide sobre (subtotal - desconto), não sobre o subtotal.
  en: VAT applies to (subtotal - discount), not to the subtotal.
limite_tempo_s: 2
solucao_referencia:
  pt: |
    PRECO_PAO = 0.30
    PRECO_LEITE = 0.85
    PRECO_QUEIJO = 3.20
    DESCONTO_CLIENTE = 0.05
    TAXA_IVA = 0.06
    PRECO_SACO = 0.10
    ARTIGOS_POR_SACO = 6

    paes = 0
    leites = 0
    queijos = 0

    # input
    paes = int(input("Pães: "))
    leites = int(input("Leites: "))
    queijos = int(input("Queijos: "))

    # processamento
    subtotal = paes * PRECO_PAO + leites * PRECO_LEITE + queijos * PRECO_QUEIJO
    desconto = subtotal * DESCONTO_CLIENTE
    iva = (subtotal - desconto) * TAXA_IVA
    artigos = paes + leites + queijos
    sacos = (artigos + ARTIGOS_POR_SACO - 1) // ARTIGOS_POR_SACO
    total = subtotal - desconto + iva + sacos * PRECO_SACO

    # output
    print("Subtotal:", round(subtotal, 2))
    print("Desconto:", round(desconto, 2))
    print("IVA:", round(iva, 2))
    print("Sacos:", sacos)
    print("Total:", round(total, 2))
  en: |
    BREAD_PRICE = 0.30
    MILK_PRICE = 0.85
    CHEESE_PRICE = 3.20
    CUSTOMER_DISCOUNT = 0.05
    VAT_RATE = 0.06
    BAG_PRICE = 0.10
    ITEMS_PER_BAG = 6

    breads = 0
    milks = 0
    cheeses = 0

    # input
    breads = int(input("Bread rolls: "))
    milks = int(input("Milk cartons: "))
    cheeses = int(input("Cheeses: "))

    # processing
    subtotal = breads * BREAD_PRICE + milks * MILK_PRICE + cheeses * CHEESE_PRICE
    discount = subtotal * CUSTOMER_DISCOUNT
    vat = (subtotal - discount) * VAT_RATE
    items = breads + milks + cheeses
    bags = (items + ITEMS_PER_BAG - 1) // ITEMS_PER_BAG
    total = subtotal - discount + vat + bags * BAG_PRICE

    # output
    print("Subtotal:", round(subtotal, 2))
    print("Discount:", round(discount, 2))
    print("VAT:", round(vat, 2))
    print("Bags:", bags)
    print("Total:", round(total, 2))

comparacao: numeros
pistas:
- pt: 'Constantes (o que é fixo): portagens, lanche por pessoa e o 2 da ida e volta. Variáveis: distância, consumo, preço do litro, pessoas.'
  en: 'Constants (what is fixed): tolls, snack per person and the 2 of the round trip. Variables: distance, consumption, price per litre, people.'
- pt: litros = distância total * consumo / 100. Só no fim dividas pelo número de pessoas.
  en: litres = total distance * consumption / 100. Only divide by the number of people at the very end.
limite_tempo_s: 2
solucao_referencia:
  pt: |
    PRECO_PORTAGENS = 12.40
    LANCHE_POR_PESSOA = 3.50
    IDA_E_VOLTA = 2

    distancia_km = 0
    consumo = 0
    preco_litro = 0
    pessoas = 0

    # input
    distancia_km = int(input("Distância (km, só ida): "))
    consumo = float(input("Consumo (L/100 km): "))
    preco_litro = float(input("Preço do litro (€): "))
    pessoas = int(input("Pessoas no carro: "))

    # processamento
    distancia_total = distancia_km * IDA_E_VOLTA
    litros = distancia_total * consumo / 100
    combustivel = litros * preco_litro
    total = combustivel + PRECO_PORTAGENS + LANCHE_POR_PESSOA * pessoas
    por_pessoa = total / pessoas

    # output
    print("Combustível:", round(combustivel, 2))
    print("Total da viagem:", round(total, 2))
    print("Cada um paga:", round(por_pessoa, 2))
  en: |
    TOLLS_PRICE = 12.40
    SNACK_PER_PERSON = 3.50
    ROUND_TRIP = 2

    distance_km = 0
    consumption = 0
    price_per_litre = 0
    people = 0

    # input
    distance_km = int(input("Distance (km, one way): "))
    consumption = float(input("Consumption (L/100 km): "))
    price_per_litre = float(input("Price per litre (€): "))
    people = int(input("People in the car: "))

    # processing
    total_distance = distance_km * ROUND_TRIP
    litres = total_distance * consumption / 100
    fuel = litres * price_per_litre
    total = fuel + TOLLS_PRICE + SNACK_PER_PERSON * people
    per_person = total / people

    # output
    print("Fuel:", round(fuel, 2))
    print("Trip total:", round(total, 2))
    print("Everyone pays:", round(per_person, 2))

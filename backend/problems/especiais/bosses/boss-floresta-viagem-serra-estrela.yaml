# Problema programa gerado (bosses); rascunho à espera de revisão do professor.
id: boss-floresta-viagem-serra-estrela
titulo:
  pt: 'Boss da Floresta: a viagem à Serra da Estrela'
  en: 'Forest Boss: the road trip to Serra da Estrela'
tipo: programa
bloco: '2'
regiao: floresta
dificuldade: 5
origem: boss
estado: rascunho
enunciado:
  pt: |
    O Bernardo vai levar a malta de carro à Serra da Estrela, ida **e volta**. O carro dele bebe combustível como se fosse um frigorífico em modo festa, por isso convém fazer as contas antes de alguém dizer "eu pago o café".

    Lê, por esta ordem (uma por linha):
    1. a distância da viagem **só de ida**, em km (inteiro);
    2. o consumo do carro, em litros por 100 km (decimal);
    3. o preço do litro, em euros (decimal);
    4. o número de pessoas no carro, incluindo o condutor (inteiro, pelo menos 1).

    Há dois custos fixos: as portagens de toda a viagem custam **12,40 €** e cada pessoa leva um lanche de **3,50 €**.

    Escreve três linhas, com os valores arredondados a 2 casas decimais:
    - `Combustível:` o custo do combustível da viagem toda (ida e volta);
    - `Total da viagem:` combustível + portagens + lanches;
    - `Cada um paga:` o total dividido igualmente pelas pessoas.
  en: |
    Bernardo is driving the gang to Serra da Estrela, **round trip**. His car drinks fuel like a fridge at a party, so let us do the maths before someone says "I'll get the coffee".

    Read, in this order (one per line):
    1. the **one-way** trip distance in km (integer);
    2. the car's consumption in litres per 100 km (decimal);
    3. the price per litre in euros (decimal);
    4. the number of people in the car, driver included (integer, at least 1).

    There are two fixed costs: the tolls for the whole trip cost **12.40 €** and each person brings a snack worth **3.50 €**.

    Print three lines, values rounded to 2 decimal places:
    - `Fuel:` the fuel cost for the whole trip (there and back);
    - `Trip total:` fuel + tolls + snacks;
    - `Everyone pays:` the total split equally among the people.

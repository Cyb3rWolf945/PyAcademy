# Problema programa gerado (bosses); rascunho à espera de revisão do professor.
id: boss-cidadela-tabela-de-pontuacoes
titulo:
  pt: 'Boss da Cidadela: a tabela de pontuações'
  en: 'Citadel Boss: the score table'
tipo: programa
bloco: '7'
regiao: cidadela
dificuldade: 5
origem: boss
estado: rascunho
enunciado:
  pt: |
    A turma fez um campeonato de jogos e é preciso afixar a tabela antes que alguém reclame. Lê:
    1. `n`, o número de alunos (inteiro, pelo menos 1);
    2. as `n` pontuações (inteiros), uma por linha.

    Escreve três linhas:
    - `Pódio:` as **3 pontuações mais altas**, da maior para a menor e separadas por espaços (se houver menos de 3 alunos, mostra as que existirem; pontuações repetidas contam todas);
    - `Média:` a média de todas as pontuações, a 2 casas decimais;
    - `Acima da média:` quantos alunos têm uma pontuação **estritamente maior** do que a média.
  en: |
    The class held a game championship and the table must be posted before someone complains. Read:
    1. `n`, the number of students (integer, at least 1);
    2. the `n` scores (integers), one per line.

    Print three lines:
    - `Podium:` the **3 highest scores**, from highest to lowest and separated by spaces (if there are fewer than 3 students, show the ones that exist; repeated scores all count);
    - `Average:` the average of all the scores, to 2 decimal places;
    - `Above average:` how many students have a score **strictly greater** than the average.
exemplos:
- &id001
  stdin: |
    5
    50
    80
    65
    95
    70
  stdout:
    pt: |-
      Pódio: 95 80 70
      Média: 72.0
      Acima da média: 2
    en: |-
      Podium: 95 80 70
      Average: 72.0
      Above average: 2
testes:

- *id001
comparacao: numeros
pistas:
- pt: Guarda as pontuações numa lista (append) e vai somando. Só depois de ter a média podes contar quantos ficam acima dela.
  en: Keep the scores in a list (append) and add them up as you go. Only once you have the average can you count how many are above it.
- pt: 'sorted(lista) ordena do menor para o maior: usa .reverse() e a fatia [:3] para o pódio. A fatia nunca dá erro se a lista for curta.'
  en: 'sorted(list) sorts from lowest to highest: use .reverse() and the slice [:3] for the podium. The slice never errors on a short list.'
limite_tempo_s: 2
solucao_referencia:
  pt: |
    NUMERO_PODIO = 3

    n = 0
    pontuacoes = []
    soma = 0
    acima_da_media = 0
    texto_podio = ""

    # input
    n = int(input("Quantos alunos: "))
    for i in range(n):
        pontuacao = int(input("Pontuação: "))
        pontuacoes.append(pontuacao)
        soma = soma + pontuacao

    # processamento
    media = soma / n
    for pontuacao in pontuacoes:
        if pontuacao > media:
            acima_da_media = acima_da_media + 1
    ordenadas = sorted(pontuacoes)
    ordenadas.reverse()
    podio = ordenadas[:NUMERO_PODIO]
    for pontuacao in podio:
        texto_podio = texto_podio + str(pontuacao) + " "

    # output
    print("Pódio:", texto_podio)
    print("Média:", round(media, 2))
    print("Acima da média:", acima_da_media)
  en: |
    PODIUM_SIZE = 3

    n = 0
    scores = []
    total = 0
    above_average = 0
    podium_text = ""

    # input
    n = int(input("How many students: "))
    for i in range(n):
        score = int(input("Score: "))
        scores.append(score)
        total = total + score

    # processing
    average = total / n
    for score in scores:
        if score > average:
            above_average = above_average + 1
    ordered = sorted(scores)
    ordered.reverse()
    podium = ordered[:PODIUM_SIZE]
    for score in podium:
        podium_text = podium_text + str(score) + " "

    # output
    print("Podium:", podium_text)
    print("Average:", round(average, 2))
    print("Above average:", above_average)

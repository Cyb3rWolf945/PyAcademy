- *id001
- *id002
comparacao: numeros
pistas:
- pt: Lê o primeiro preço antes do while e volta a ler no fim de cada volta. O máximo começa em 0 (os preços válidos são positivos).
  en: Read the first price before the while and read again at the end of each pass. The maximum starts at 0 (valid prices are positive).
- pt: 'Cuidado com a divisão por zero: só calcules a média se quantidade > 0.'
  en: 'Beware of division by zero: only compute the average if quantity > 0.'
limite_tempo_s: 2
solucao_referencia:
  pt: |
    preco = 0
    quantidade = 0
    total = 0
    maior = 0
    media = 0

    # input
    preco = float(input("Preço do artigo (0 para terminar): "))

    # processamento
    while preco != 0:
        if preco > 0:
            quantidade = quantidade + 1
            total = total + preco
            if preco > maior:
                maior = preco
        preco = float(input("Preço do artigo (0 para terminar): "))

    if quantidade > 0:
        media = total / quantidade

    # output
    print("Artigos:", quantidade)
    print("Total:", round(total, 2))
    print("Média:", round(media, 2))
    print("Mais caro:", round(maior, 2))
  en: |
    price = 0
    quantity = 0
    total = 0
    highest = 0
    average = 0

    # input
    price = float(input("Item price (0 to finish): "))

    # processing
    while price != 0:
        if price > 0:
            quantity = quantity + 1
            total = total + price
            if price > highest:
                highest = price
        price = float(input("Item price (0 to finish): "))

    if quantity > 0:
        average = total / quantity

    # output
    print("Items:", quantity)
    print("Total:", round(total, 2))
    print("Average:", round(average, 2))
    print("Most expensive:", round(highest, 2))

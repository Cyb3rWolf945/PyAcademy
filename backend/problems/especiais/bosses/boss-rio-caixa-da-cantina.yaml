      Média: 2.0
      Mais caro: 2.0
    en: |-
      Items: 1
      Total: 2.0
      Average: 2.0
      Most expensive: 2.0
- stdin: '7

    0

    '
  stdout:
    pt: |-
      Artigos: 1
      Total: 7.0
      Média: 7.0
      Mais caro: 7.0
    en: |-
      Items: 1
      Total: 7.0
      Average: 7.0
      Most expensive: 7.0
- stdin: |
    1.2
    1.2
    1.2
    9.9
    0

# Problema programa gerado (bosses); rascunho à espera de revisão do professor.
id: boss-rio-caixa-da-cantina
titulo:
  pt: 'Boss do Rio: a caixa da cantina'
  en: 'River Boss: the canteen till'
tipo: programa
bloco: '5'
regiao: rio
dificuldade: 5
origem: boss
estado: rascunho
enunciado:
  pt: |
    A D. Luísa, da cantina, passa o dia a registar preços e à hora de fecho ninguém sabe quanto fez. Faz o programa da caixa!

    Lê preços (decimais, um por linha) **até ser lido o valor `0`**, que significa "fim do dia". Os valores **negativos** são engano de digitação: ignora-os (não contam para nada). O `0` final não é um artigo.

    No fim escreve quatro linhas, com valores decimais a 2 casas:
    - `Artigos:` quantos preços válidos foram registados (inteiro);
    - `Total:` a soma dos preços válidos;
    - `Média:` o preço médio (se não houve artigos, 0);
    - `Mais caro:` o preço mais alto (se não houve artigos, 0).
  en: |
    Mrs. Luísa, from the canteen, spends the day typing prices and at closing time nobody knows how much she made. Write the till program!

    Read prices (decimals, one per line) **until the value `0` is read**, which means "end of day". **Negative** values are typos: ignore them (they count for nothing). The final `0` is not an item.

    At the end print four lines, decimals with 2 places:
    - `Items:` how many valid prices were registered (integer);
    - `Total:` the sum of the valid prices;
    - `Average:` the average price (if there were no items, 0);
    - `Most expensive:` the highest price (if there were no items, 0).
exemplos:
- &id001
  stdin: '1.5

    2.5

    0

    '
  stdout:
    pt: |-
      Artigos: 2
      Total: 4.0
      Média: 2.0
      Mais caro: 2.5
    en: |-
      Items: 2
      Total: 4.0
      Average: 2.0
      Most expensive: 2.5
- &id002
  stdin: '0

    '
  stdout:
    pt: |-
      Artigos: 0
      Total: 0
      Média: 0
      Mais caro: 0
    en: |-
      Items: 0
      Total: 0
      Average: 0
      Most expensive: 0
testes:
- stdin: '-3

    2

    0

    '
  stdout:
    pt: |-

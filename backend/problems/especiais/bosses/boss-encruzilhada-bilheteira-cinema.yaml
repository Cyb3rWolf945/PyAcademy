comparacao: numeros
pistas:
- pt: 'A ordem dos if/elif é a prioridade das regras: a mais forte (quarta) vem primeiro. O suplemento é um if separado, não um elif.'
  en: 'The order of the if/elif chain is the rule priority: the strongest one (Wednesday) comes first. The surcharge is a separate if, not an elif.'
- pt: 'Estudante: estudante == "sim" and idade <= 25. Fim de semana: dia == "sabado" or dia == "domingo".'
  en: 'Student: student == "sim" and age <= 25. Weekend: day == "sabado" or day == "domingo".'
limite_tempo_s: 2
solucao_referencia:
  pt: |
    BILHETE_NORMAL = 8.00
    BILHETE_REDUZIDO = 4.50
    BILHETE_ESTUDANTE = 6.00
    BILHETE_QUARTA = 5.00
    SUPLEMENTO_FIM_DE_SEMANA = 1.50
    DESCONTO_GRUPO = 0.10
    GRUPO_MINIMO = 5

    idade = 0
    dia = ""
    estudante = ""
    quantidade = 0
    preco = 0

    # input
    idade = int(input("Idade: "))
    dia = input("Dia da semana: ")
    estudante = input("Estudante (sim/nao): ")
    quantidade = int(input("Bilhetes: "))

    # processamento
    dia = dia.lower()
    estudante = estudante.lower()
    if dia == "quarta":
        preco = BILHETE_QUARTA
    elif idade < 12 or idade >= 65:
        preco = BILHETE_REDUZIDO
    elif estudante == "sim" and idade <= 25:
        preco = BILHETE_ESTUDANTE
    else:
        preco = BILHETE_NORMAL

    if dia == "sabado" or dia == "domingo":
        preco = preco + SUPLEMENTO_FIM_DE_SEMANA

    total = preco * quantidade
    if quantidade >= GRUPO_MINIMO:
        total = total * (1 - DESCONTO_GRUPO)

    # output
    print("Bilhete:", round(preco, 2))
    print("Total:", round(total, 2))
  en: |
    NORMAL_TICKET = 8.00
    REDUCED_TICKET = 4.50
    STUDENT_TICKET = 6.00
    WEDNESDAY_TICKET = 5.00
    WEEKEND_SURCHARGE = 1.50
    GROUP_DISCOUNT = 0.10
    GROUP_MINIMUM = 5

    age = 0
    day = ""
    student = ""
    quantity = 0
    price = 0

    # input
    age = int(input("Age: "))
    day = input("Day of the week: ")
    student = input("Student (sim/nao): ")
    quantity = int(input("Tickets: "))

    # processing
    day = day.lower()
    student = student.lower()
    if day == "quarta":
        price = WEDNESDAY_TICKET
    elif age < 12 or age >= 65:
        price = REDUCED_TICKET
    elif student == "sim" and age <= 25:
        price = STUDENT_TICKET
    else:
        price = NORMAL_TICKET

    if day == "sabado" or day == "domingo":
        price = price + WEEKEND_SURCHARGE

    total = price * quantity
    if quantity >= GROUP_MINIMUM:
        total = total * (1 - GROUP_DISCOUNT)

    # output
    print("Ticket:", round(price, 2))
    print("Total:", round(total, 2))

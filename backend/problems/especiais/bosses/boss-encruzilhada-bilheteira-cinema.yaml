# Problema programa gerado (bosses); rascunho à espera de revisão do professor.
id: boss-encruzilhada-bilheteira-cinema
titulo:
  pt: 'Boss da Encruzilhada: a bilheteira do cinema'
  en: 'Crossroads Boss: the cinema box office'
tipo: programa
bloco: '4'
regiao: encruzilhada
dificuldade: 5
origem: boss
estado: rascunho
enunciado:
  pt: |
    O cinema da faculdade quer um sistema de preços que não confunda o Sr. da bilheteira. Lê, uma por linha:
    1. a idade (inteiro);
    2. o dia da semana, em minúsculas ou maiúsculas, sem acentos: `segunda`, `terca`, `quarta`, `quinta`, `sexta`, `sabado`, `domingo`;
    3. se é estudante: `sim` ou `nao`;
    4. quantos bilhetes quer comprar (inteiro, pelo menos 1), todos ao mesmo preço.

    Regras do preço de **um** bilhete (aplica-as por esta ordem de prioridade):
    - à **quarta** (dia do cinema) custa 5,00 €, para toda a gente;
    - senão, quem tem **menos de 12** ou **65 ou mais** anos paga 4,50 €;
    - senão, um **estudante com 25 anos ou menos** paga 6,00 €;
    - senão, o preço normal é 8,00 €.
    - A seguir, ao **sábado e domingo** soma-se um suplemento de 1,50 € (a quarta nunca é fim de semana, é claro).

    Depois, grupos de **5 ou mais bilhetes** têm 10% de desconto no total.

    Escreve duas linhas: `Bilhete:` (o preço de um bilhete, já com suplemento) e `Total:` (o total a pagar, com desconto de grupo se houver), ambos com 2 casas decimais.
  en: |
    The campus cinema wants a pricing system that will not confuse the box-office clerk. Read, one per line:
    1. the age (integer);
    2. the day of the week, in lower or upper case, no accents: `segunda`, `terca`, `quarta`, `quinta`, `sexta`, `sabado`, `domingo` (Portuguese day names: Monday to Sunday);
    3. whether the person is a student: `sim` (yes) or `nao` (no);
    4. how many tickets they want (integer, at least 1), all at the same price.

    Price rules for **one** ticket (apply them in this priority order):
    - on **Wednesday** (`quarta`, cinema day) it costs 5.00 €, for everyone;
    - otherwise, anyone **under 12** or **65 or older** pays 4.50 €;
    - otherwise, a **student aged 25 or less** pays 6.00 €;
    - otherwise the normal price is 8.00 €.
    - Then, on **Saturday and Sunday** add a surcharge of 1.50 € (Wednesday is never a weekend, of course).

    After that, groups of **5 or more tickets** get a 10% discount on the total.

    Print two lines: `Ticket:` (the price of one ticket, surcharge included) and `Total:` (the amount to pay, with the group discount if any), both with 2 decimal places.

  devolve:
  - z
  - 1
  - 1
comparacao: exato
ordem_importa: true
pistas:
- pt: 'Substitui cada sinal por um espaço, usa .lower() e .split(). Depois conta com um dicionário: contagem[palavra] = contagem.get(palavra, 0) + 1.'
  en: 'Replace each sign with a space, use .lower() and .split(). Then count with a dictionary: counts[word] = counts.get(word, 0) + 1.'
- pt: 'Percorre as palavras com sorted(contagem): como já vêm por ordem alfabética, só trocas o melhor se a contagem for estritamente maior.'
  en: 'Walk through the words with sorted(counts): they already come alphabetically, so only replace the best one if the count is strictly greater.'
limite_tempo_s: 2
solucao_referencia: |
  def analisar_mensagem(texto):
      SINAIS = ".,!?;:"
      limpo = texto.lower()
      for sinal in SINAIS:
          limpo = limpo.replace(sinal, " ")
      contagem = {}
      for palavra in limpo.split():
          contagem[palavra] = contagem.get(palavra, 0) + 1
      if len(contagem) == 0:
          return ["", 0, 0]
      melhor = ""
      for palavra in sorted(contagem):
          if melhor == "" or contagem[palavra] > contagem[melhor]:
              melhor = palavra
      return [melhor, contagem[melhor], len(contagem)]

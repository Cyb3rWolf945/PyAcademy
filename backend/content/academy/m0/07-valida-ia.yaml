id: m0-07-valida-ia
modulo: m0
ordem: 7
titulo: {pt: "Valida a IA", en: "Validate the AI"}
aprender:
  pt: |
    Pediste a uma IA um programa que calcule a **média de 3 notas**. Ela respondeu em segundos, com fluxograma e Python bonitos. O programa **corre sem dar erro**. Mas está certo?

    Lê com atenção a linha do cálculo. Repara na **prioridade dos operadores**: a divisão faz-se antes da soma, tal como na matemática. Sem parênteses, `nota1 + nota2 + nota3 / 3` só divide a **última** nota por 3.

    Com as notas 12, 14 e 16 devia dar 14.0, mas dá 31.33... Nenhum erro aparece no ecrã, só um resultado errado. Por isso é que **a IA ajuda, mas tu decides**.
  en: |
    You asked an AI for a program that computes the **average of 3 marks**. It answered in seconds, with a neat flowchart and Python. The program **runs without errors**. But is it right?

    Read the calculation line carefully. Notice **operator precedence**: division happens before addition, just like in maths. Without parentheses, `nota1 + nota2 + nota3 / 3` divides only the **last** mark by 3.

    With marks 12, 14 and 16 it should give 14.0, but it gives 31.33... No error shows on screen, just a wrong result. That is why **AI helps, but you decide**.
exemplo:
  id: media-3-notas-ia
  titulo: {pt: "Média de 3 notas (gerada por IA)", en: "Average of 3 marks (AI-generated)"}
  corpo:
    - {id: d, tipo: definir, texto: {pt: "definir real nota1, nota2, nota3, media", en: "define real nota1, nota2, nota3, media"}, py: null}
    - {id: l1, tipo: ler, texto: {pt: "ler nota1", en: "read nota1"}, py: 'nota1 = float(input("Nota 1: "))'}
    - {id: l2, tipo: ler, texto: {pt: "ler nota2", en: "read nota2"}, py: 'nota2 = float(input("Nota 2: "))'}
    - {id: l3, tipo: ler, texto: {pt: "ler nota3", en: "read nota3"}, py: 'nota3 = float(input("Nota 3: "))'}
    - {id: c, tipo: calcular, texto: {pt: "media = nota1 + nota2 + nota3 / 3", en: "media = nota1 + nota2 + nota3 / 3"}, py: "media = nota1 + nota2 + nota3 / 3"}
    - {id: e, tipo: escrever, texto: {pt: 'escrever "Média = " + media', en: 'write "Average = " + media'}, py: 'print("Média =", media)'}
slides:
  - {deck: aula-2, de: 34, ate: 34}
pistas:
  - pt: "Calcula à mão com 12, 14 e 16 e compara com o que o programa faria."
    en: "Work it out by hand with 12, 14 and 16 and compare with what the program would do."
  - pt: "Qual é feita primeiro: a soma ou a divisão?"
    en: "Which happens first: the addition or the division?"
atividades:
  - tipo: pergunta
    enunciado:
      pt: "Este programa foi gerado por uma IA. Lê o fluxograma e o Python e encontra o erro."
      en: "This program was generated by an AI. Read the flowchart and the Python and find the mistake."
    pergunta:
      pt: "Qual é o erro?"
      en: "What is the mistake?"
    opcoes:
      - {pt: "Faltam parênteses: só a última nota é dividida por 3", en: "Parentheses are missing: only the last mark is divided by 3"}
      - {pt: "O input() devolve texto e não número", en: "input() returns text, not a number"}
      - {pt: "O print está mal escrito", en: "The print is written wrongly"}
      - {pt: "Falta ler uma quarta nota", en: "A fourth mark should be read"}
    resposta: [0]
    explicacao:
      pt: "A divisão tem prioridade sobre a soma, por isso `nota3 / 3` calcula-se primeiro. O float() trata bem do texto do input() e o print está certo."
      en: "Division has priority over addition, so `nota3 / 3` is computed first. float() handles the input() text fine and the print is correct."
  - tipo: completar
    enunciado:
      pt: "Corrige a linha do cálculo para a média sair certa."
      en: "Fix the calculation line so the average comes out right."
    lacunas:
      - {stmt: c, lado: py, modelo: {pt: "media = ___ / 3", en: "media = ___ / 3"}, respostas: ["(nota1 + nota2 + nota3)"]}
    explicacao:
      pt: "Os parênteses obrigam a somar as três notas antes de dividir por 3."
      en: "The parentheses force the three marks to be added before dividing by 3."
verificacao:
  pergunta:
    pt: "Com as notas 12, 14 e 16, o programa gerado pela IA mostra..."
    en: "With marks 12, 14 and 16, the AI-generated program shows..."
  opcoes:
    - {pt: "14.0, a média certa", en: "14.0, the right average"}
    - {pt: "Cerca de 31.33, um valor errado", en: "About 31.33, a wrong value"}
    - {pt: "Uma mensagem de erro", en: "An error message"}
  resposta: [1]

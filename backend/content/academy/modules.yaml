# Módulos da Academia (ordem de apresentação). Um módulo sem ficheiros de secções aparece como "Em breve".
# `bloco` = id do curriculum.yaml: se esse bloco estiver aberto, o módulo abre (motivo "teacher").
- id: m0
  ordem: 0
  titulo: {pt: "Porquê programar? Linguagens e IA", en: "Why program? Languages and AI"}
  descricao:
    pt: "O que é dar ordens a um computador, como ele guarda tudo em 0 e 1 e onde entra a IA na escada das linguagens."
    en: "What it means to give orders to a computer, how it stores everything as 0s and 1s, and where AI fits on the ladder of languages."
  icone: m0
  peca: inicio-fim
  dificuldade: 1
  bloco: "1"
  sempre_aberto: true
- id: m1
  ordem: 1
  titulo: {pt: "Algoritmos e fluxogramas", en: "Algorithms and flowcharts"}
  descricao:
    pt: "Receitas, algoritmos e as formas do fluxograma, até à tua primeira tradução para Python."
    en: "Recipes, algorithms and the flowchart shapes, up to your first translation into Python."
  icone: m1
  peca: setas
  dificuldade: 1
  bloco: "1"
- id: m2
  ordem: 2
  titulo: {pt: "Do fluxograma ao Python: sequencial", en: "From flowchart to Python: sequential"}
  descricao:
    pt: "Tipos, variáveis, ler, calcular e escrever: constrói programas sequenciais completos, do fluxograma ao Python."
    en: "Types, variables, reading, calculating and writing: build complete sequential programs, from flowchart to Python."
  icone: m2
  peca: ler-escrever
  dificuldade: 2
  bloco: "2"
- id: m3
  ordem: 3
  titulo: {pt: "Decomposição", en: "Decomposition"}
  descricao:
    pt: "Missões da loja XPTO: separa o que entra, o que é fixo e o que se calcula antes de escrever uma linha de código."
    en: "XPTO store missions: separate what goes in, what is fixed and what is calculated before writing a line of code."
  icone: m3
  peca: processo
  dificuldade: 2
  bloco: "3"
- id: m4
  ordem: 4
  titulo: {pt: "Decisões", en: "Decisions"}
  descricao:
    pt: "Comparações, and/or/not e if/elif/else: ensina o programa a escolher o caminho, do café ao gato."
    en: "Comparisons, and/or/not and if/elif/else: teach the program to choose its path, from the coffee to the cat."
  icone: m4
  peca: decisao
  dificuldade: 3
  bloco: "4"
- id: m5
  ordem: 5
  titulo: {pt: "Repetição", en: "Repetition"}
  descricao:
    pt: "Ciclos for e while, contadores, acumuladores e traçar a execução, fugindo aos erros clássicos."
    en: "for and while loops, counters, accumulators and tracing execution, avoiding the classic mistakes."
  icone: m5
  peca: ciclo
  dificuldade: 3
  bloco: "5"
- id: m6
  ordem: 6
  titulo: {pt: "Funções", en: "Functions"}
  descricao:
    pt: "Dá nome a um bloco de código: define e chama funções, passa parâmetros, devolve valores e acaba com o código repetido."
    en: "Name a block of code: define and call functions, pass parameters, return values and put an end to repeated code."
  icone: m6
  peca: funcao
  dificuldade: 4
  bloco: "6"
- id: m7
  ordem: 7
  titulo: {pt: "Listas", en: "Lists"}
  descricao:
    pt: "Listas: índices, for, append, somas e máximos à mão, pesquisa e ordenação."
    en: "Lists: indexes, for, append, sums and maxima by hand, searching and sorting."
  icone: m7
  peca: lista
  dificuldade: 4
  bloco: "7"
- id: bugs
  ordem: 8
  titulo: {pt: "Caça aos bugs", en: "Bug hunt"}
  descricao:
    pt: "Os erros clássicos das aulas: aprende a reconhecê-los à primeira vista."
    en: "The classic mistakes from class: learn to spot them at a glance."
  icone: bugs
  peca: lupa
  dificuldade: 3
  bloco: "2"

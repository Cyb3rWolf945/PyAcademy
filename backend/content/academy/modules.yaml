# Módulos da Academia (ordem de apresentação). Só M0 e M1 têm secções na fase A1; os restantes aparecem como "Em breve".
# `bloco` = id do curriculum.yaml: se esse bloco estiver aberto, o módulo abre (motivo "teacher").
- id: m0
  ordem: 0
  titulo: {pt: "Porquê programar? Linguagens e IA", en: "Why program? Languages and AI"}
  descricao:
    pt: "O que é dar ordens a um computador, como ele guarda tudo em 0 e 1 e onde entra a IA na escada das linguagens."
    en: "What it means to give orders to a computer, how it stores everything as 0s and 1s, and where AI fits on the ladder of languages."
  icone: m0
  peca: inicio-fim
  dificuldade: 1
  bloco: "1"
  sempre_aberto: true
- id: m1
  ordem: 1
  titulo: {pt: "Algoritmos e fluxogramas", en: "Algorithms and flowcharts"}
  descricao:
    pt: "Receitas, algoritmos e as formas do fluxograma, até à tua primeira tradução para Python."
    en: "Recipes, algorithms and the flowchart shapes, up to your first translation into Python."
  icone: m1
  peca: setas
  dificuldade: 1
  bloco: "1"
- id: m2
  ordem: 2
  titulo: {pt: "Do fluxograma ao Python: sequencial", en: "From flowchart to Python: sequential"}
  descricao:
    pt: "Variáveis, tipos, ler, calcular e escrever: os blocos de qualquer programa sequencial."
    en: "Variables, types, reading, calculating and writing: the building blocks of any sequential program."
  icone: m2
  peca: ler-escrever
  dificuldade: 2
  bloco: "2"
- id: m3
  ordem: 3
  titulo: {pt: "Decomposição", en: "Decomposition"}
  descricao:
    pt: "Partir um problema em entradas, variáveis, constantes e operações, antes de escrever uma linha de código."
    en: "Break a problem into inputs, variables, constants and operations before writing a single line of code."
  icone: m3
  peca: processo
  dificuldade: 2
  bloco: "3"
- id: m4
  ordem: 4
  titulo: {pt: "Decisões", en: "Decisions"}
  descricao:
    pt: "Comparações, and/or/not e if/elif/else: ensina o programa a escolher o caminho."
    en: "Comparisons, and/or/not and if/elif/else: teach the program to choose its path."
  icone: m4
  peca: decisao
  dificuldade: 3
  bloco: "4"
- id: m5
  ordem: 5
  titulo: {pt: "Repetição", en: "Repetition"}
  descricao:
    pt: "Ciclos for e while, traçar a execução e fugir aos erros clássicos."
    en: "for and while loops, tracing execution and avoiding the classic mistakes."
  icone: m5
  peca: ciclo
  dificuldade: 3
  bloco: "5"
- id: m6
  ordem: 6
  titulo: {pt: "Funções", en: "Functions"}
  descricao:
    pt: "Dividir o programa em partes com nome, parâmetros e valor devolvido."
    en: "Split the program into named parts with parameters and return values."
  icone: m6
  peca: funcao
  dificuldade: 4
  bloco: "6"
- id: m7
  ordem: 7
  titulo: {pt: "Listas", en: "Lists"}
  descricao:
    pt: "Guardar vários valores de uma vez e percorrê-los, ordená-los e pesquisá-los."
    en: "Store many values at once, then walk through, sort and search them."
  icone: m7
  peca: lista
  dificuldade: 4
  bloco: "7"
- id: bugs
  ordem: 8
  titulo: {pt: "Caça aos bugs", en: "Bug hunt"}
  descricao:
    pt: "Os erros clássicos das aulas: aprende a reconhecê-los à primeira vista."
    en: "The classic mistakes from class: learn to spot them at a glance."
  icone: bugs
  peca: lupa
  dificuldade: 3
  bloco: "2"

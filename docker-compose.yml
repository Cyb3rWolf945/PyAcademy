# PyArena: proxy (Caddy) + app (FastAPI) + db (PostgreSQL).
# Redes: "public" (proxy <-> app), "internal" (app <-> db) e "sandbox" (app <-> runner), as duas últimas sem
# saída para a internet. O runner só está na rede sandbox: não vê a BD nem a internet.
# Fase seguinte: serviço "backup".
name: pyarena

services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://pyarena:${POSTGRES_PASSWORD}@db:5432/pyarena
      TEST_DATABASE_URL: postgresql+asyncpg://pyarena:${POSTGRES_PASSWORD}@db:5432/pyarena_test
      SESSION_SECRET: ${SESSION_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TEACHER_USERNAME: ${TEACHER_USERNAME:-}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RUNNER_URL: http://runner:9000
      RUNNER_TOKEN: ${RUNNER_TOKEN}
    volumes:
      - slides:/data/slides:ro
      - docs:/data/docs
    networks: [public, internal, sandbox]
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6

  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pyarena
      POSTGRES_DB: pyarena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyarena -d pyarena"]
      interval: 5s
      timeout: 3s
      retries: 10

  runner:
    build:
      context: ./runner
      target: runner
    restart: unless-stopped
    # sem `init: true`: o docker-init seria o PID 1 com o RUNNER_TOKEN no ambiente e legível pelos filhos.
    # O PID 1 é o server.py (não despejável, sem token no ambiente) e recolhe os zombies ele próprio.
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN}
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: ${RUNNER_CPUS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 4s
      start_period: 10s
      retries: 5

  # Conversor de slides: só corre quando o professor importa um deck (perfil "tools"), sem rede e sem acesso à BD.
  # Escreve para o volume "slides" (que a app monta só de leitura). Ver docs/SLIDES.md.
  converter:
    profiles: ["tools"]
    build:
      context: ./converter
    network_mode: none
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    volumes:
      - slides:/data/slides

  # backup:  (fase posterior) pg_dump diário para ./backups

networks:
  public:
  internal:
    internal: true
  sandbox:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  slides:
  docs:  # PDFs carregados pelo professor (Leitura recomendada) e a cache das páginas

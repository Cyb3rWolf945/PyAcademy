<!doctype html>
<!-- Entrada da app (sem sessão): herói com a ilha 3D, login, código de turma, atalho de torneio e "como funciona". -->
<html lang="pt-PT" data-theme="floresta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16241a">
  <title>PyArena</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="preload" as="font" type="font/woff2" href="/vendor/fonts/PressStart2P-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/vendor/fonts/PixelifySans-latin.woff2" crossorigin>
  <script src="/services/theme-boot.js"></script>
  <link rel="stylesheet" href="/dist/app.css">
</head>
<body class="min-h-dvh">
  <header id="hero" class="scene-host hero">
  <div class="hero-fx" aria-hidden="true"><i class="cloud cloud--a"></i><i class="cloud cloud--b"></i><i class="cloud cloud--c"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i></div>
  <div class="hero-edge" aria-hidden="true"></div>
    <div class="scene-content flex items-start justify-between gap-2">
      <a class="logo-pixel text-lg sm:text-2xl md:text-5xl" href="/" aria-label="PyArena"><img src="/assets/sprites/icons/logo-64.png" width="64" height="64" alt="" class="sprite size-8 md:size-16"><span class="logo-stack"><span class="logo-word" aria-hidden="true"><span>P</span><span>y</span><span>A</span><span>r</span><span>e</span><span>n</span><span>a</span></span><small class="logo-sub hidden sm:block" data-i18n="brand.university"></small></span></a>
      <div class="flex gap-2">
        <div data-theme-switch></div>
        <div class="flex gap-2" data-lang-switch></div>
      </div>
    </div>
  </header>

  <main class="enter-stagger mx-auto grid max-w-4xl gap-5 p-4 pb-10 md:grid-cols-2">
    <p class="text-center text-lg md:col-span-2 md:text-xl" data-i18n="landing.tagline">&nbsp;</p>

    <form id="login-form" class="panel-pixel grid content-start gap-3" autocomplete="on">
      <h2 class="text-sm" data-i18n="landing.login_title"></h2>
      <label class="grid gap-1"><span data-i18n="field.username"></span>
        <input class="input-pixel" name="username" autocomplete="username" autocapitalize="none" required maxlength="64"></label>
      <label class="grid gap-1"><span data-i18n="field.password"></span>
        <input class="input-pixel" name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
      <p class="min-h-5 text-danger" role="alert" data-error></p>
      <button class="btn-pixel btn-pixel--lg" type="submit" data-i18n="landing.login_button"></button>
    </form>

    <form id="tournament-form" class="panel-pixel grid content-start gap-3 md:order-last md:col-span-2" method="get" action="/pages/tournament/tournament.html" autocomplete="off">
      <h2 class="flex items-center gap-3 text-sm"><img class="sprite" src="/assets/sprites/icons/trophy.png" width="32" height="32" alt=""><span data-i18n="landing.code_title"></span></h2>
      <div class="flex flex-wrap items-end gap-3">
        <label class="grid min-w-40 flex-1 gap-1"><span data-i18n="field.tournament_code"></span>
          <input class="input-pixel uppercase" name="code" maxlength="12" autocapitalize="characters" autocomplete="off" required></label>
        <button class="btn-pixel btn-pixel--accent" type="submit" data-i18n="landing.code_button"></button>
      </div>
    </form>

    <form id="join-form" class="panel-pixel grid content-start gap-3" autocomplete="off">
      <h2 class="text-sm" data-i18n="landing.join_title"></h2>
      <label class="grid gap-1"><span data-i18n="field.join_code"></span>
        <input class="input-pixel uppercase" name="join_code" maxlength="6" autocapitalize="characters" required></label>
      <label class="grid gap-1"><span data-i18n="field.display_name"></span>
        <input class="input-pixel" name="display_name" maxlength="40" required></label>
      <label class="grid gap-1"><span data-i18n="field.email"></span>
        <input class="input-pixel" name="email" type="email" autocomplete="email" maxlength="254" required></label>
      <label class="grid gap-1"><span data-i18n="field.username"></span>
        <input class="input-pixel" name="username" autocapitalize="none" required minlength="3" maxlength="32"></label>
      <label class="grid gap-1"><span data-i18n="field.password_new"></span>
        <input class="input-pixel" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
      <p class="min-h-5 text-danger" role="alert" data-error></p>
      <button class="btn-pixel secondary" type="submit" data-i18n="landing.join_button"></button>
    </form>

    <section id="leaderboard" class="md:col-span-2" aria-labelledby="lb-title"></section>

    <section class="md:col-span-2" aria-labelledby="how-title">
      <h2 id="how-title" class="mb-3 text-center text-sm" data-i18n="landing.how_title"></h2>
      <div class="grid grid-cols-3 gap-3">
        <div class="how-step"><img class="sprite sprite--lg" src="/assets/sprites/icons/world.png" width="64" height="64" alt=""><b data-i18n="landing.how_1_t"></b><span data-i18n="landing.how_1_d"></span></div>
        <div class="how-step"><img class="sprite sprite--lg" src="/assets/sprites/icons/duel.png" width="64" height="64" alt=""><b data-i18n="landing.how_2_t"></b><span data-i18n="landing.how_2_d"></span></div>
        <div class="how-step"><img class="sprite sprite--lg anim-coin" src="/assets/sprites/icons/trophy.png" width="64" height="64" alt=""><b data-i18n="landing.how_3_t"></b><span data-i18n="landing.how_3_d"></span></div>
      </div>
    </section>
  </main>
  <script type="module" src="/pages/landing/landing.js"></script>
</body>
</html>

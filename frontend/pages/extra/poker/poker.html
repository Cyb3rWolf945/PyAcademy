<!doctype html>
<!-- Poker (Extra): consentimento, lista de mesas e mesa em pixel art, com pontos reais de score. -->
<html lang="pt-PT" data-theme="floresta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16241a">
  <title>PyArena</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-32.png">
  <script src="/services/theme-boot.js"></script>
  <link rel="stylesheet" href="/dist/app.css">
</head>
<body class="min-h-dvh pb-24 lg:pb-0 lg:pl-56">
  <header class="flex items-center justify-between gap-2 p-3 pt-[max(0.75rem,env(safe-area-inset-top))]">
    <h1 class="min-w-0 truncate text-xl text-accent" id="page-title" data-i18n="poker.title"></h1>
    <div class="flex items-center gap-2"><span id="conn" hidden></span><div class="flex gap-2" data-lang-switch></div></div>
  </header>
  <main id="view" class="pk-main mx-auto grid max-w-5xl grid-cols-1 gap-4 p-3 [&>*]:min-w-0"></main>
  <div id="dialog-host"></div>
  <div data-bottom-nav></div>
  <script type="module" src="/pages/extra/poker/poker.js"></script>
</body>
</html>

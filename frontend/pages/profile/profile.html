<!doctype html>
<!-- Perfil: nome, idioma, tema, palavra-passe e direitos RGPD (exportar/apagar dados). -->
<html lang="pt-PT" data-theme="floresta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a1f">
  <title>PyArena</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <script src="/services/theme-boot.js"></script>
  <link rel="stylesheet" href="/dist/app.css">
</head>
<body class="min-h-dvh pb-24 lg:pb-0 lg:pl-56">
  <header class="flex items-center justify-between gap-2 p-3 pt-[max(0.75rem,env(safe-area-inset-top))]">
    <h1 class="text-xl text-accent" data-i18n="nav.profile"></h1>
    <div class="flex gap-2"><div data-score-hud></div><div class="flex gap-2" data-lang-switch></div></div>
  </header>
  <main class="enter-stagger mx-auto grid max-w-3xl gap-4 p-4">
    <section class="panel-pixel hud" aria-label="Perfil">
      <div class="hud-avatar"><img class="sprite" src="/assets/sprites/icons/profile.png" width="56" height="56" alt=""><span class="hud-level" id="p-level-n">1</span></div>
      <div class="grid min-w-0 flex-1 gap-2">
        <p class="truncate font-pixel text-xs" id="p-name">&nbsp;</p>
        <div class="hud-chips"><span class="chip"><img src="/assets/sprites/icons/star.png" width="20" height="20" alt=""><span id="p-level"></span></span><span class="chip"><img src="/assets/sprites/icons/coin.png" width="20" height="20" alt=""><span id="p-score">0</span></span><span class="chip"><img src="/assets/sprites/icons/shield.png" width="20" height="20" alt=""><span id="p-role"></span></span></div>
      </div>
    </section>
    <form id="prefs-form" class="panel-pixel grid gap-3">
      <h2 class="text-lg" data-i18n="profile.preferences"></h2>
      <label class="grid gap-1 text-sm"><span data-i18n="field.display_name"></span>
        <input class="input-pixel" name="display_name" maxlength="40" required></label>
      <label class="grid gap-1 text-sm"><span data-i18n="field.locale"></span>
        <select class="input-pixel" name="locale"></select></label>
      <label class="grid gap-1 text-sm"><span data-i18n="field.theme"></span>
        <select class="input-pixel" name="preferred_theme"></select></label>
      <label class="grid gap-1 text-sm"><span data-i18n="field.font"></span>
        <select class="input-pixel" name="preferred_font"></select>
        <span class="text-muted" data-i18n="profile.font_help"></span></label>
      <label class="flex min-h-[44px] items-center gap-3 text-sm"><input id="sound-toggle" type="checkbox" class="h-6 w-6 shrink-0 accent-[var(--c-accent)]">
        <span data-i18n="profile.toast_sound"></span></label>
      <button class="btn-pixel" type="submit" data-i18n="common.save"></button>
    </form>
    <section id="documents" class="panel-pixel docs-admin grid gap-3" hidden></section>
    <form id="join-class-form" class="panel-pixel grid gap-3" hidden>
      <h2 class="text-lg" data-i18n="profile.join_class_title"></h2>
      <p class="text-sm text-muted" data-i18n="profile.join_class_help"></p>
      <label class="grid gap-1 text-sm"><span data-i18n="profile.join_class_code"></span>
        <input class="input-pixel" name="join_code" maxlength="6" required></label>
      <button class="btn-pixel" type="submit" data-i18n="profile.join_class_button"></button>
    </form>

    <section id="lb-section" class="panel-pixel grid gap-3">
      <h2 class="text-lg" data-i18n="profile.lb_title"></h2>
      <dl class="grid grid-cols-2 gap-2 text-sm">
        <div class="bg-surface-2 p-2"><dt class="text-xs text-muted" data-i18n="profile.lb_points_all"></dt><dd id="lb-all" class="font-pixel text-lg text-accent">-</dd></div>
        <div class="bg-surface-2 p-2"><dt class="text-xs text-muted" data-i18n="profile.lb_points_week"></dt><dd id="lb-week" class="font-pixel text-lg text-accent">-</dd></div>
      </dl>
      <p id="lb-rank" class="text-sm text-muted"></p>
      <label class="flex min-h-[44px] items-center gap-3"><input id="lb-toggle" type="checkbox" class="h-6 w-6 shrink-0 accent-[var(--c-accent)]">
        <span class="text-sm" data-i18n="profile.lb_toggle"></span></label>
      <p class="text-xs text-muted" data-i18n="profile.lb_privacy"></p>
    </section>

    <form id="pw-form" class="panel-pixel grid gap-3">
      <h2 class="text-lg" data-i18n="password.title"></h2>
      <label class="grid gap-1 text-sm"><span data-i18n="field.password_current"></span>
        <input class="input-pixel" name="current" type="password" autocomplete="current-password" required maxlength="256"></label>
      <label class="grid gap-1 text-sm"><span data-i18n="field.password_new"></span>
        <input class="input-pixel" name="next" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
      <button class="btn-pixel" type="submit" data-i18n="password.submit"></button>
    </form>

    <section class="panel-pixel grid gap-3">
      <h2 class="text-lg" data-i18n="profile.data"></h2>
      <p class="text-sm text-muted" data-i18n="profile.data_help"></p>
      <button id="export-btn" class="btn-pixel secondary" type="button" data-i18n="profile.export"></button>
      <label class="grid gap-1 text-sm"><span data-i18n="profile.delete_password"></span>
        <input id="delete-password" class="input-pixel" type="password" autocomplete="current-password" maxlength="256"></label>
      <button id="delete-btn" class="btn-pixel danger" type="button" data-i18n="profile.delete"></button>
      <button id="logout-btn" class="btn-pixel secondary" type="button" data-i18n="profile.logout"></button>
    </section>
  </main>
  <div data-bottom-nav></div>
  <script type="module" src="/pages/profile/profile.js"></script>
</body>
</html>
